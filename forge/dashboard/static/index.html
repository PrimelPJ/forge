<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge - ICS Security Monitor</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<header>
  <h1>FORGE <span class="subtitle">Water Treatment Plant - ICS Security Monitor</span></h1>
  <div id="status">
    <span id="conn-status" class="tag offline">OFFLINE</span>
    <span id="alert-count" class="tag">0 alerts</span>
  </div>
</header>

<main>
  <section id="process">
    <h2>Process Values</h2>
    <div class="grid">
      <div class="card">
        <div class="label">Tank Level</div>
        <div class="value" id="tank-level">-</div>
        <div class="bar-track"><div class="bar-fill" id="tank-bar"></div></div>
      </div>
      <div class="card">
        <div class="label">Chlorine</div>
        <div class="value" id="chlorine">-</div>
        <div class="bar-track"><div class="bar-fill chlorine" id="chlorine-bar"></div></div>
      </div>
      <div class="card">
        <div class="label">Inlet Pressure</div>
        <div class="value" id="pressure">-</div>
      </div>
      <div class="card">
        <div class="label">Flow Rate</div>
        <div class="value" id="flow">-</div>
      </div>
    </div>

    <h2>Actuators</h2>
    <div class="actuators">
      <span class="actuator" id="act-intake">INTAKE PUMP</span>
      <span class="actuator" id="act-dosing">DOSING PUMP</span>
      <span class="actuator" id="act-outlet">OUTLET VALVE</span>
      <span class="actuator" id="act-estop">E-STOP</span>
    </div>

    <div class="alarms" id="alarms"></div>
  </section>

  <section id="alerts">
    <h2>Alerts <span class="count" id="alert-total"></span></h2>
    <div id="alert-feed"></div>
  </section>

  <section id="assets">
    <h2>OT Asset Inventory</h2>
    <table id="asset-table">
      <thead><tr><th>IP</th><th>Role</th><th>Reads</th><th>Writes</th><th>Last Seen</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="/static/dashboard.js"></script>
</body>
</html>
